# Throwaway MySQL for the live validation harness.
#   docker compose up -d / docker compose down -v
services:
    mysql:
        image: mysql:8.4
        container_name: reldens-tut-06-mysql
        restart: unless-stopped
        command: --mysql-native-password=ON
        environment:
            MYSQL_ROOT_PASSWORD: reldens
            MYSQL_DATABASE: reldens_tut_06
            MYSQL_USER: reldens
            MYSQL_PASSWORD: reldens
        ports:
            - "3312:3306"
        volumes:
            - reldens-tut-06-mysql:/var/lib/mysql
        healthcheck:
            test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-preldens"]
            interval: 5s
            timeout: 5s
            retries: 20

volumes:
    reldens-tut-06-mysql:
